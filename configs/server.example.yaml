listen:
  # 0.0.0.0 for docker
  # Bare-metal use 127.0.0.1
  address: "0.0.0.0:8443"

auth:
  # Server host key — generate with:
  #   gipnoz-server keygen
  private_key: "base64-ed25519-seed-here"
  # Allowed client identities list — one entry per client, key from `gipnoz-client keygen`
  clients:
    - name: "client1"
      key: "base64-client-public-key-1"

padding:
  min: 16
  max: 256

security_log: "/var/log/gipnoz/security.log"

timeouts:
  connect_seconds: 10
  idle_seconds: 300

rate_limit:
  max_streams_per_ip: 64
