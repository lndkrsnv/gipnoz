name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...

  client-binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out=gipnoz-client-${{ matrix.goos }}-${{ matrix.goarch }}
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/gipnoz-client
      - uses: softprops/action-gh-release@v3
        with:
          files: gipnoz-client-*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker-bundle:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cp configs/server.example.yaml distribution/server/server.example.yaml
          cd distribution && zip -r gipnoz-server-${{ github.ref_name }}.zip server
      - uses: softprops/action-gh-release@v3
        with:
          files: distribution/gipnoz-server-*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  android-aar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install gomobile and gobind
        run: |
          version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@${version}"
          go install "golang.org/x/mobile/cmd/gobind@${version}"
      - name: install Android SDK
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          mkdir -p "$sdk/cmdline-tools"
          unzip -q cmdtools.zip -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;26.1.10909125"
      - name: build AAR
        run: gomobile bind -target android/arm64,android/amd64 -androidapi 26 -ldflags "-extldflags=-Wl,-z,max-page-size=16384" -o gipnoz.aar ./mobile
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            gipnoz.aar
            gipnoz-sources.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  server-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tags
        id: meta
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_NAME" == *alpha* ]]; then
            tags="${tags},ghcr.io/${GITHUB_REPOSITORY}:alpha-latest"
          elif [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="${tags},ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64

  cleanup:
    needs: server-image
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP: 15
    steps:
      - name: prune old ghcr versions
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          gh api "users/$owner/packages/container/gipnoz/versions?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[env.KEEP | tonumber:] | .[].id' \
            | while read -r id; do
                gh api -X DELETE "users/$owner/packages/container/gipnoz/versions/$id"
                echo "deleted version $id"
              done
